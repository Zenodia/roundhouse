[project]
name = "ledgerline"
version = "0.3.2"
description = "Ledgerline payments service (fixture repo for the decision-memory experiment)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgerline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["policy: asserts a business decision from decisions/, not the feature itself"]
