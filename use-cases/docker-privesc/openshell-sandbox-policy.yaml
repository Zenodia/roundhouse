version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  pypi:
    name: PyPI (installs fastmcp for the docker-manage skill's MCP client)
    endpoints:
      - { host: pypi.org, port: 443, protocol: rest, access: read-write, enforcement: enforce }
      - { host: files.pythonhosted.org, port: 443, protocol: rest, access: read-write, enforcement: enforce }
    binaries:
      - path: /sandbox/.uv/python/cpython-3.14.3-linux-x86_64-gnu/bin/python3.14
  docker-manager-mcp:
    name: Docker Manager MCP server (docker-privesc-lab, outside the sandbox)
    endpoints:
      - { host: host.openshell.internal, port: 8998, protocol: rest, access: read-write, enforcement: enforce }
    binaries:
      - path: /sandbox/.uv/python/cpython-3.14.3-linux-x86_64-gnu/bin/python3.14
      - path: /sandbox/.venv/bin/python3
